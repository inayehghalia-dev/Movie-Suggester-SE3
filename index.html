<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Suggester - SE3 Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="main-title">🎬 Movie Suggester</h1>
        <p>Can't decide what to watch? Let us help you!</p>
        
        <div id="movie-display" class="movie-box">
            <h2 id="movie-title">Press the button to get a suggestion!</h2>
            <p id="movie-genre"></p>
        </div>

        <button id="suggest-btn">Suggest a Movie</button>
        <button id="another-btn" style="display:none;">Suggest Another One</button>

        <div class="filter-section">
            </div>
            <!-- بداية مهمة فاطمة دياب SS-17: واجهة إضافة الأفلام -->
        <div class="add-movie-section">
            <hr>
            <h3>Add a New Movie 🎬</h3>
            <div class="form-group">
                <input type="text" id="new-movie-title" placeholder="Enter movie title...">
                <input type="text" id="new-movie-genre" placeholder="Enter genre (e.g. Drama)...">
                <button id="add-btn">Add Movie</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
<footer>
    <p>Developed by: Ghalia, Fatima & Esraa</p>
    <p>Year: 2026 | Software Engineering 3</p>
</footer>
</html>
