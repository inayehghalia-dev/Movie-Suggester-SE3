<body>
    <div class="container">
        <h1>🎬 Movie Suggester</h1>
        <p>Can't decide what to watch? Let us help you!</p>
        
        <div id="movie-display" class="movie-box">
            <h2 id="movie-title">Press the button to get a suggestion!</h2>
            <p id="movie-genre"></p>
        </div>

        <button id="suggest-btn">Suggest a Movie</button>
        <button id="another-btn" style="display:none;">Suggest Another One</button>

        <div class="filter-section">
            </div>
    </div>

    <script src="script.js"></script>
